name: CI

# Só o que muda o programa dispara o CI: um commit no artigo custava 2h30 de Actions.
on:
  push:
    paths: ['simulador/**', '.github/workflows/**']
  pull_request:
    paths: ['simulador/**', '.github/workflows/**']
  # A ponta a ponta roda só quando alguém pede, pela aba Actions ("Run workflow").
  workflow_dispatch:

# Um push novo no mesmo ramo cancela a execução anterior: a suíte de ponta a ponta
# leva mais de uma hora, e num repositório privado cada minuto sai da cota da conta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: simulador
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: simulador/.nvmrc
          cache: npm
          cache-dependency-path: simulador/package-lock.json
      - run: npm ci
      - run: npm run tipos
      - run: npm run lint
      - run: npm run arquitetura
      - run: npm run unidade

  # Ponta a ponta só no Ubuntu: o SwiftShader desenha igual em qualquer máquina, e as
  # imagens de referência foram gravadas com ele. Ficam de fora o @lento (percorre
  # todas as dicas pelo teclado) e os @gpu, que medem o que acontece por quadro
  # (giro, voo, placas) e precisam de uma placa de vídeo de verdade; rodam à mão.
  #
  # Fora do push: sem placa de vídeo o executor desenha por software e a suíte leva
  # mais de uma hora. Ela roda à mão (workflow_dispatch) ou na máquina de quem mexe no
  # programa, com `npm run e2e`.
  ponta-a-ponta:
    if: github.event_name == 'workflow_dispatch'
    # Fixo, e não ubuntu-latest: o rótulo muda de versão sozinho (desde 19/10/2026 é o
    # 26.04), e as imagens de referência foram gravadas e conferidas no 24.04. Trocar de
    # versão é uma decisão, com as imagens conferidas de novo.
    runs-on: ubuntu-24.04
    # Medido: 2h45 no executor do GitHub, com SwiftShader. 180 deixava pouca folga.
    timeout-minutes: 240
    defaults:
      run:
        working-directory: simulador
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: simulador/.nvmrc
          cache: npm
          cache-dependency-path: simulador/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --grep-invert "@lento|@gpu"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: falhas-e2e
          # Sem os trace.zip: uma falha subiu 514 MB, acima da cota de armazenamento de
          # um repositório privado gratuito. O contexto do erro e as diferenças bastam.
          path: |
            simulador/test-results/**/error-context.md
            simulador/test-results/**/*.png
            simulador/testes/e2e/douradas/**/_diff-*.png
          retention-days: 14
