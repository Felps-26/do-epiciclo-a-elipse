name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: simulador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: simulador/.nvmrc
          cache: npm
          cache-dependency-path: simulador/package-lock.json
      - run: npm ci
      - run: npm run tipos
      - run: npm run lint
      - run: npm run arquitetura
      - run: npm run unidade
